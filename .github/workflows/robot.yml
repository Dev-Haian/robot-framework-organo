name: Validação Robot Framework

# Os testes precisam do Organo rodando localmente. No CI validamos
# a sintaxe e as keywords de todas as suítes com --dryrun.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validar suítes (dry run)
        run: robot --dryrun --outputdir results testes
